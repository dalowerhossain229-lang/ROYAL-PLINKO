<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL PLINKO - BALL DROPPING KING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">ROYAL PLINKO</div>
            <div class="game">BALL DROPPING KING</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎯 ওরিজিনাল প্লিংকো ফিজিক্স পেগ বোর্ড উইন্ডো জোন ভাই ভাই -->
    <div class="plinko-board-zone">
        <div class="board-window-frame">
            <canvas id="plinkoCanvas"></canvas>
            
            <!-- 🚀 [২৩টি ডাইনামিক ওডস ডিসপ্লে রো]: আপনার ড্রয়িং চার্ট হুবহু ২৩টি ক্লিয়ার নিয়ন কালার স্লটে লক ভাই ভাই! -->
            <div class="multipliers-footer-row" id="multipliers-bar-holder">
                <div class="mult-box bg-red-jackpot">500</div>
                <div class="mult-box bg-orange-high">100</div>
                <div class="mult-box bg-orange-high">50</div>
                <div class="mult-box bg-orange-high">10</div>
                <div class="mult-box bg-yellow-low">5</div>
                <div class="mult-box bg-yellow-low">3.0</div>
                <div class="mult-box bg-yellow-low">2.0</div>
                <div class="mult-box bg-green-safe">0.5</div>
                <div class="mult-box bg-green-safe">0.3</div>
                <div class="mult-box bg-green-safe">0.2</div>
                <div class="mult-box bg-blue-zero">0</div>
                <div class="mult-box bg-green-safe">0.2</div>
                <div class="mult-box bg-green-safe">0.3</div>
                <div class="mult-box bg-green-safe">0.5</div>
                <div class="mult-box bg-yellow-low">2.0</div>
                <div class="mult-box bg-yellow-low">3.0</div>
                <div class="mult-box bg-yellow-low">5</div>
                <div class="mult-box bg-orange-high">10</div>
                <div class="mult-box bg-orange-high">50</div>
                <div class="mult-box bg-orange-high">100</div>
                <div class="mult-box bg-red-jackpot">500</div>
            </div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং ও উইন-লস মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">আপনার বাজি ধরুন এবং সোনার বল ড্রপ করুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handlePlinkoBallDropAction()">BET</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 সকেট লাইব্রেরি সিঙ্ক -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        const canvas = document.getElementById("plinkoCanvas");
        const ctx = canvas.getContext("2d");

        let pegsArray = [];
        const rowsCount = 21; // ২৩টি স্লটের জন্য সুষম ২১-পেগ রো চাবি ভাই ভাই

        function resizePlinkoCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 36; 
            buildPegsTriangleMatrix();
        }

        function buildPegsTriangleMatrix() {
            pegsArray = [];
            const startY = 30;
            const spacingY = (canvas.height - startY) / (rowsCount + 1);

            for (let r = 0; r < rowsCount; r++) {
                const countInRow = r + 3; 
                const y = startY + r * spacingY;
                const spacingX = canvas.width / (countInRow + 1);

                for (let c = 0; c < countInRow; c++) {
                    const x = (c + 1) * spacingX;
                    pegsArray.push({ x, y });
                }
            }
            drawPlinkoPegsBoard();
        }

        function drawPlinkoPegsBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            pegsArray.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, 2.5, 0, Math.PI * 2); // ২১টি সারির জন্য পেগের সাইজ ছোট এবং সূক্ষ্ম লক ভাই
                ctx.fill();
            });

            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 8);
            ctx.lineTo(canvas.width / 2 - 6, 20);
            ctx.lineTo(canvas.width / 2 + 6, 20);
            ctx.closePath();
            ctx.fill();
        }

        function runPlinkoBallDropAnimation(serverData) {
            const pathInstructions = serverData.ballPath || [];
            const finalSlotIdx = serverData.slotIndex || 0;
            
            let currentX = canvas.width / 2;
            let currentY = 12;
            
            const startY = 30;
            const spacingY = (canvas.height - startY) / (rowsCount + 1);

            let animationNodesList = [{ x: currentX, y: currentY }];

            for (let r = 0; r < rowsCount - 1; r++) {
                const nextRowPegCount = r + 3;
                const nextSpacingX = canvas.width / (nextRowPegCount + 1);
                const nextY = startY + r * spacingY;

                let choice = pathInstructions[r] !== undefined ? pathInstructions[r] : Math.floor(Math.random()*2);
                let targetPegIdx = Math.floor((currentX / canvas.width) * (nextRowPegCount + 1)) - 1;
                if (choice === 1) targetPegIdx += 1;
                
                if (targetPegIdx < 0) targetPegIdx = 0;
                if (targetPegIdx >= nextRowPegCount) targetPegIdx = nextRowPegCount - 1;

                const targetX = (targetPegIdx + 1) * nextSpacingX;
                animationNodesList.push({ x: (currentX + targetX)/2, y: nextY - spacingY/2 });
                animationNodesList.push({ x: targetX, y: nextY });

                currentX = targetX;
                currentY = nextY;
            }

            // ২৩টি স্লটের জন্য কাস্টম উইডথ ক্যালকুলেটর ভাই ভাই
            const finalFooterSpacingX = canvas.width / 21;
            const destinationX = (finalSlotIdx * finalFooterSpacingX) + (finalFooterSpacingX / 2);
            animationNodesList.push({ x: destinationX, y: canvas.height });

            let frameStepIdx = 0;
            const ballPhysicsTimeline = setInterval(() => {
                if (frameStepIdx >= animationNodesList.length) {
                    clearInterval(ballPhysicsTimeline);
                    triggerFooterSlotFlashGlow(finalSlotIdx);
                    showFinalGameReward(serverData.status, serverData.winAmount, serverData.multiplier);
                    return;
                }

                drawPlinkoPegsBoard();
                ctx.fillStyle = "#f1c40f";
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#f1c40f";
                ctx.beginPath();
                ctx.arc(animationNodesList[frameStepIdx].x, animationNodesList[frameStepIdx].y, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                if (frameStepIdx % 2 === 0) playAudio('click');
                frameStepIdx++;
            }, 30); // 🚀 ২১টি রো এর জন্য বল পড়ার এনিমেশন স্পিড আরও ফাস্ট ৩০ms লক ভাই ভাই!
        }

        function triggerFooterSlotFlashGlow(slotIdx) {
            const slots = document.querySelectorAll(".mult-box");
            if (slots[slotIdx]) {
                slots[slotIdx].classList.add("slot-flash-active-glow");
                setTimeout(() => { slots[slotIdx].classList.remove("slot-flash-active-glow"); }, 1200);
            }
        }

                async function handlePlinkoBallDropAction() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🔴 গোল্ডেন লাকি বল ড্রপ হচ্ছে...";

            playAudio('spin');
            resizePlinkoCanvas();

            try {
                const response = await fetch(`${SERVER_URL}/api/plinko-drop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: urlUserId, amount: parseFloat(currentBet), wallet: urlWallet })
                });
                const data = await response.json();
                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");
                    
                    runPlinkoBallDropAnimation(data);
                } else {
                    alert(data.message || "❌ Insufficient Balance!");
                    stopPlinkoState();
                }
            } catch (err) {
                alert("⚠️ সেশন আউট! আবার BET বোতাম চাপুন।");
                stopPlinkoState();
            }
        }

        function showFinalGameReward(status, winAmount, multiplier) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (multiplier > 1.0) {
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! বল হিট করেছে x${multiplier} বক্সে [৳${winAmount}]`;
            } else if (multiplier === 1.0 || (multiplier < 1.0 && multiplier > 0)) {
                playAudio('click');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🤝 বল হিট করেছে x${multiplier} বক্সে [৳${winAmount}]`;
            } else {
                playAudio('wheel'); 
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ বল মাঝখানের ০ (ZERO) বক্সে হিট করেছে! বাজি সম্পূর্ণ লস ভাই ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopPlinkoState();
            if (isAuto) { autoInterval = setTimeout(() => { if (isAuto) handlePlinkoBallDropAction(); }, 2500); }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => { if (data && data.username === urlUserId) fetchLiveBalance(); });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/plinko-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) {}
        }

        window.onload = () => {
            window.addEventListener('resize', resizePlinkoCanvas);
            resizePlinkoCanvas();
            fetchLiveBalance();
        };

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else if (currentBet <= 1000) currentBet -= 100;
                else currentBet -= 500;
            }
            if (action === 'plus' && currentBet < 20000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else if (currentBet < 1000) currentBet += 100;
                else currentBet += 500;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 20000) currentBet = 20000;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
            Object.values(slotSounds).forEach(s => s.muted = isMuted);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handlePlinkoBallDropAction();
            playAudio('click');
        }

        function stopPlinkoState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { if (isMuted) return; try { slotSounds[type].currentTime = 0; slotSounds[type].play(); } catch(e){} }
    </script>
</body>
</html>
