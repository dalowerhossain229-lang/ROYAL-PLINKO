<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL PLINKO MASTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">ROYAL PLINKO</div>
            <div class="game">BALL DROPPING KING</div>
        </div>
        <div class="header-right">
            <!-- 🔈 সাউন্ড অন-অফ বোতাম ভাই ভাই -->
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎡 [প্লাঙ্কো ক্যানভাস ফিজিক্স জোন] (ছবি ছাড়া পিউর কোডিং ভাই ভাই) -->
    <div class="plinko-outer-zone">
        <canvas id="plinko-board" width="400" height="500"></canvas>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">আপনার বাজি ধরুন এবং সোনার বল ড্রপ করুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও BET বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleBallDrop()">BET</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("plinko-board");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false; // বল চলমান থাকার ফ্লাগ ভাই ভাই
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // 🎯 প্লাঙ্কো ৮-রো স্ট্যান্ডার্ড পিন বোর্ড এবং মাল্টিপ্লায়ার ম্যাপিং ভাই ভাই
        const rows = 8;
        const pins = [];
        const buckets = [10, 2, 0.5, 0.2, 0.2, 0.5, 2, 10]; // নিচে সাজানো ৮টি মেগা মাল্টিপ্লায়ার ঘর
        const bucketColors = ["#e74c3c", "#e67e22", "#f1c40f", "#2ecc71", "#2ecc71", "#f1c40f", "#e67e22", "#e74c3c"];
        
        let activeBalls = [];

        // পিনগুলোর অবস্থান ডাইনামিক রেন্ডারার জেনারেটর ম্যাথ ভাই
        function initPins() {
            pins.length = 0;
            const startY = 60;
            const spacingY = 40;
            for (let r = 0; r < rows; r++) {
                const count = r + 3;
                const spacingX = 35;
                const startX = (canvas.width - (count - 1) * spacingX) / 2;
                for (let c = 0; c < count; c++) {
                    pins.push({
                        x: startX + c * spacingX,
                        y: startY + r * spacingY
                    });
                }
            }
        }

        // 🎡 ক্যানভাসে প্লাঙ্কো বোর্ড লাইভ রেন্ডারিং লুপ ভাই ভাই
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ১. সাদা চকচকে পিনগুলো ড্র করা ভাই ভাই
            ctx.fillStyle = "#ffffff";
            pins.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // ২. নিচে সাজানো ৮টি মেগা মাল্টিপ্লায়ার ঘর ক্যানভাসে ড্র করা ভাই
            const startY = 60 + rows * 40;
            const bucketWidth = 40;
            const totalWidth = buckets.length * bucketWidth;
            const startX = (canvas.width - totalWidth) / 2;

            for (let i = 0; i < buckets.length; i++) {
                ctx.fillStyle = bucketColors[i];
                ctx.fillRect(startX + i * bucketWidth, startY, bucketWidth - 4, 25);
                
                ctx.fillStyle = "#000000";
                ctx.font = "bold 11px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(`x${buckets[i]}`, startX + i * bucketWidth + (bucketWidth - 4) / 2, startY + 12.5);
            }
        }

        // 🧠 [সোনার বলের থ্রিডি ফিজিক্স এনিমেশন লুপ ইঞ্জিন ভাই ভাই]
        function updateBalls() {
            let stillActive = false;
            activeBalls.forEach((ball, bIdx) => {
                if (!ball.active) return;
                stillActive = true;

                // মধ্যাকর্ষণ টান এবং গতি সিঙ্কিং ভাই ভাই
                ball.y += ball.speedY;
                ball.speedY += 0.3; // Gravity pull acceleration
                ball.x += ball.speedX;
                ball.speedX *= 0.98; // Friction drag air resistance

                // পিনের সাথে বলের কড়া মেটালিক ধাক্কা লাগার ট্র্যাকিং ম্যাথ
                pins.forEach(p => {
                    const dist = Math.hypot(ball.x - p.x, ball.y - p.y);
                    if (dist < 10) { // Ball radius 6 + Pin radius 4 = 10
                        playAudio('spin'); // 🚀 পিনে ধাক্কা লাগলেই spin2.mp3 খটখট মেটালিক আওয়াজ আসবে!
                        
                        // ফিজিক্স ডিগবাজি বাউন্স এঙ্গেল লকিং ভাই ভাই
                        const angle = Math.atan2(ball.y - p.y, ball.x - p.x);
                        ball.speedX = Math.cos(angle) * 3 + (Math.random() - 0.5);
                        ball.speedY = Math.abs(Math.sin(angle) * 3) + 1;
                        
                        // বল পিনের ভেতর যাতে আটকে না যায় তার ব্যাকআপ ট্রিকস
                        ball.x = p.x + Math.cos(angle) * 10.5;
                        ball.y = p.y + Math.sin(angle) * 10.5;
                    }
                });

                // নিচের মেগা মাল্টিপ্লায়ার ঘরের ভেতরে বল ঢোকার ফাইনাল চেক ভাই ভাই
                const targetY = 60 + rows * 40;
                if (ball.y >= targetY && ball.y <= targetY + 10) {
                    const bucketWidth = 40;
                    const totalWidth = buckets.length * bucketWidth;
                    const startX = (canvas.width - totalWidth) / 2;
                    const landingIdx = Math.floor((ball.x - startX) / bucketWidth);

                    if (landingIdx >= 0 && landingIdx < buckets.length && ball.active) {
                        ball.active = false;
                        if (landingIdx === ball.serverTargetIdx) {
                            showFinalReward(ball.prizeText, ball.winAmount);
                        } else {
                            // ক্যানভাস ভিজ্যুয়াল এডজাস্টমেন্ট সিঙ্ক লক
                            showFinalReward(buckets[landingIdx].toString(), Math.floor(currentBet * buckets[landingIdx]));
                        }
                    } else if (ball.y > canvas.height) {
                        ball.active = false;
                        showFinalReward("0.2", Math.floor(currentBet * 0.2));
                    }
                }

                // লাইভ সোনার বল ক্যানভাসে ড্র করা ভাই ভাই
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = "#f1c40f";
                ctx.shadowBlur = 10;
            });

            // শ্যাডobuf ক্লিয়ারিং ট্রিকস
            ctx.shadowBlur = 0;

            if (stillActive) {
                requestAnimationFrame(() => {
                    drawBoard();
                    updateBalls();
                });
            } else {
                isSpinning = false;
                if (!isAuto) document.getElementById("spin-btn").disabled = false;
                drawBoard();
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/plinko-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            initPins();
            drawBoard();
        };

               // 🎯 ৳১ থেকে ৳২০০০ পর্যন্ত নিখুঁত প্লাস-মাইনাস ইঞ্জিন লক ভাই ভাই
        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleBallDrop();
            playAudio('click');
        }

        async function handleBallDrop() {
            if (isSpinning) return;

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🟡 সোনার বল ড্রপ হচ্ছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/plinko-drop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    const bucketWidth = 40;
                    const totalWidth = buckets.length * bucketWidth;
                    const boardStartX = (canvas.width - totalWidth) / 2;
                    
                    const targetXCenter = boardStartX + data.targetIdx * bucketWidth + bucketWidth / 2;
                    const diffX = targetXCenter - (canvas.width / 2);

                    const newBall = {
                        x: (canvas.width / 2) + (Math.random() * 6 - 3),
                        y: 30,
                        speedX: (diffX / 40) + (Math.random() * 0.4 - 0.2),
                        speedY: 1.5,
                        active: true,
                        serverTargetIdx: data.targetIdx,
                        prizeText: data.prizeText,
                        winAmount: data.winAmount
                    };

                    activeBalls = [newBall];
                    
                    requestAnimationFrame(() => {
                        drawBoard();
                        updateBalls();
                    });

                } else {
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    isSpinning = false;
                    document.getElementById("spin-btn").disabled = false;
                }
            } catch (err) {
                alert("⚠️ সেশন আউট! আবার বাজি ধরুন ভাই ভাই।");
                isSpinning = false;
                document.getElementById("spin-btn").disabled = false;
            }
        }

        function showFinalReward(prizeText, winAmount) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            const multVal = parseFloat(prizeText) || 0;

            if (multVal >= 1) {
                if (multVal >= 5) {
                    playAudio('bigwin');
                } else {
                    playAudio('win');
                }
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! বল পড়েছে: x${prizeText} এর ঘরে (৳${winAmount})`;
            } else {
                playAudio('wheel');
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ বল পড়েছে: x${prizeText} এর ঘরে। এই রাউন্ডে লাভ হয়নি ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleBallDrop();
                }, 1500);
            }
        }

        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            bigwin: new Audio('bigwin1.mp3'),
            wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; 
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
